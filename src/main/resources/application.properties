spring.application.name=parkease

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/parkease?options=-c%20TimeZone=Asia/Kolkata
spring.datasource.username=parkease_user
spring.datasource.password=${PARKEASE_DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8081

# Actuator Health Endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'